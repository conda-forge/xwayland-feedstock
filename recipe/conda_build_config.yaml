# xwayland-glamor-gbm.c includes linux/dma-buf.h (Linux 4.6), which the
# default linux-64/ppc64le sysroot (glibc 2.17, kernel 3.10 headers) does not
# provide -- the initial feedstock build failed on both with
# "fatal error: linux/dma-buf.h: No such file or directory". The aarch64 build
# only passed because its 2.17 sysroot happens to ship newer kernel headers.
# The 2.28 sysroot ships kernel 4.18 headers everywhere, which is enough.
# weston and neatvnc set 2.34 for their own reasons (linux/udmabuf.h,
# getrandom()); Xwayland itself needs neither, so keep the lower floor.
c_stdlib_version:   # [linux]
  - "2.28"          # [linux]
